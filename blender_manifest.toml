schema_version = "1.0.0"

id = "blender_interactive_terminal"
version = "1.0.0"
name = "Blender Interactive Terminal"
tagline = "A native, interactive VT100 terminal emulator for the Blender UI"
maintainer = "Blender Interactive Terminal Contributors"
type = "add-on"

website = "https://github.com/piyushk/blender-terminal"

tags = ["User Interface", "Development", "Pipeline"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

# Bundled Python wheels (pyte/wcwidth are pure Python; pywinpty is Windows-only)
wheels = [
    "./wheels/pyte-0.8.0-py2.py3-none-any.whl",
    "./wheels/wcwidth-0.8.3-py3-none-any.whl",
    # Windows ConPTY backend (Blender picks the wheel matching its Python)
    "./wheels/pywinpty-3.1.0-cp311-cp311-win_amd64.whl",
    "./wheels/pywinpty-3.1.0-cp312-cp312-win_amd64.whl",
    "./wheels/pywinpty-3.1.0-cp313-cp313-win_amd64.whl",
]

# Target platforms — Blender uses "os-arch" string format
platforms = ["macos-arm64", "macos-x64", "linux-x64", "windows-x64"]
